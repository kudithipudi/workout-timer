<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc" />
  <title>Workout Timer · Coach Interval Timer</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a href="#board" class="skip-link">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-tile" aria-hidden="true">W</span>
        <span class="brand-text">
          <h1 class="brand-name">Workout Timer</h1>
          <span class="brand-tagline">Coach interval timer</span>
        </span>
      </a>
      <div class="actions">
        <button id="startAll"  class="btn ghost" title="Start every paused timer">Start all</button>
        <button id="pauseAll"  class="btn ghost" title="Pause every running timer">Pause all</button>
        <button id="resetReps" class="btn ghost" title="Zero everyone's rep count">Reset reps</button>
        <button id="muteBtn"   class="btn ghost icon" title="Mute / unmute tones" aria-pressed="false" aria-label="Mute tones">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
            <path class="mute-x" d="M17 9l4 6M21 9l-4 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="addBtn" class="btn primary">＋ Add student</button>
        <a class="lab-link" href="https://lab.kudithipudi.org/" title="Back to lab.kudithipudi.org"><span aria-hidden="true">←</span> lab.kudithipudi.org</a>
      </div>
    </div>
  </header>

  <main id="board" class="board"></main>
  <p id="status" class="sr-only" aria-live="polite"></p>

  <section id="empty" class="empty" hidden>
    <div class="empty-card">
      <h2>No students yet</h2>
      <p>Add your first athlete to start running intervals. Their roster, intervals and rep counts will be saved on this device.</p>
      <button class="btn primary lg" id="addBtnEmpty">＋ Add student</button>
    </div>
  </section>

  <template id="card-tpl">
    <article class="card" data-id="">
      <header class="card-head">
        <span class="swatch" aria-hidden="true"></span>
        <input class="name" type="text" maxlength="24" spellcheck="false" aria-label="Student name" />
        <button class="iconbtn remove" title="Remove student" aria-label="Remove">×</button>
      </header>

      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-track" cx="100" cy="100" r="90" />
          <circle class="ring-fill"  cx="100" cy="100" r="90" />
        </svg>
        <div class="ring-center">
          <div class="time" aria-live="off">00:30</div>
          <div class="state">paused</div>
        </div>
      </div>

      <div class="bar" aria-hidden="true"><div class="bar-fill"></div></div>

      <button class="expand-toggle" type="button" aria-expanded="false">
        <span class="expand-label-more">Adjust interval &amp; reps</span>
        <span class="expand-label-less">Hide</span>
        <svg class="expand-chev" width="12" height="8" viewBox="0 0 12 8" aria-hidden="true">
          <path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="presets" role="group" aria-label="Duration presets">
        <button data-sec="20"  class="chip">20s</button>
        <button data-sec="30"  class="chip">30s</button>
        <button data-sec="45"  class="chip">45s</button>
        <button data-sec="60"  class="chip">1m</button>
        <button data-sec="90"  class="chip">1:30</button>
        <button data-sec="120" class="chip">2m</button>
        <button data-sec="180" class="chip">3m</button>
        <button data-sec="300" class="chip">5m</button>
      </div>

      <form class="custom" autocomplete="off">
        <label class="custom-label">
          <span class="custom-label-text">Custom</span>
          <input type="number" class="mm" min="0" max="59" placeholder="45" inputmode="numeric" />
          <span class="colon">:</span>
          <input type="number" class="ss" min="0" max="59" placeholder="00" inputmode="numeric" />
        </label>
        <button class="btn ghost sm" type="submit">Set</button>
      </form>

      <div class="controls">
        <button class="btn primary play" type="button">Start</button>
        <button class="btn ghost reset"  type="button">Reset</button>
      </div>

      <footer class="reps">
        <div class="reps-label">Reps</div>
        <div class="reps-value">0</div>
        <div class="reps-controls">
          <button class="iconbtn rep-dec" title="Decrement reps" aria-label="Decrement">−</button>
          <button class="iconbtn rep-inc" title="Increment reps" aria-label="Increment">＋</button>
          <button class="btn ghost xs rep-zero" type="button">Zero</button>
        </div>
      </footer>
    </article>
  </template>

  <footer class="sitefooter">
    <div class="sitefooter-inner">
      <p>Part of the <a href="https://lab.kudithipudi.org/">Kudithipudi AI Lab</a></p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
